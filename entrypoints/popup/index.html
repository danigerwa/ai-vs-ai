<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AI vs AI</title>
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      body {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        width: 240px;
        background: #0f0f0f;
        color: #e8e8e8;
      }

      .header {
        padding: 14px 16px 10px;
        border-bottom: 1px solid #2a2a2a;
        display: flex;
        align-items: flex-start;
        justify-content: space-between;
      }

      .header h1 {
        font-size: 13px;
        font-weight: 600;
        letter-spacing: 0.02em;
        color: #e8e8e8;
      }

      .header p {
        font-size: 11px;
        color: #666;
        margin-top: 2px;
      }

      #btn-settings {
        background: none;
        border: none;
        color: #555;
        cursor: pointer;
        font-size: 18px;
        padding: 0;
        line-height: 1;
        flex-shrink: 0;
        margin-top: 1px;
        transition: color 0.15s;
      }

      #btn-settings:hover {
        color: #999;
      }

      .buttons {
        padding: 12px;
        display: flex;
        flex-direction: column;
        gap: 8px;
      }

      .llm-btn {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 10px 12px;
        border: 1px solid #2a2a2a;
        border-radius: 8px;
        background: #1a1a1a;
        color: #e8e8e8;
        font-size: 13px;
        font-weight: 500;
        cursor: pointer;
        transition: background 0.15s, border-color 0.15s;
        width: 100%;
        text-align: left;
      }

      .llm-btn:hover {
        background: #232323;
        border-color: #3a3a3a;
      }

      .llm-btn:active {
        background: #2a2a2a;
      }

      .llm-btn .icon {
        width: 20px;
        height: 20px;
        border-radius: 4px;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 12px;
        flex-shrink: 0;
      }

      .llm-btn .label {
        flex: 1;
      }

      .llm-btn .arrow {
        font-size: 11px;
        color: #555;
      }

      .status {
        padding: 8px 12px 12px;
        font-size: 11px;
        color: #666;
        text-align: center;
        min-height: 28px;
      }

      .status.error {
        color: #e05555;
      }

      .status.loading {
        color: #888;
      }

      .mode-bar {
        display: none;
        padding: 10px 12px 0;
      }

      .scope-bar {
        display: none;
        padding: 8px 12px 0;
      }

      .mode-picker {
        width: 100%;
        display: flex;
        flex-direction: column;
        gap: 5px;
      }

      .scope-picker {
        width: 100%;
        display: flex;
        flex-direction: column;
        gap: 5px;
      }

      .mode-picker-label {
        font-size: 10px;
        color: #777;
        letter-spacing: 0.04em;
        text-transform: uppercase;
      }

      .mode-select {
        width: 100%;
        background: #1a1a1a;
        border: 1px solid #2a2a2a;
        border-radius: 8px;
        color: #e8e8e8;
        font-size: 12px;
        padding: 8px 10px;
        outline: none;
      }

      .scope-inline {
        display: flex;
        gap: 6px;
        align-items: center;
      }

      .last-n-wrap {
        display: none;
        align-items: center;
        gap: 4px;
        color: #999;
        font-size: 11px;
        flex-shrink: 0;
      }

      .last-n-input {
        width: 54px;
        background: #1a1a1a;
        border: 1px solid #2a2a2a;
        border-radius: 8px;
        color: #e8e8e8;
        font-size: 12px;
        padding: 8px 8px;
        outline: none;
      }

      #not-supported {
        padding: 16px;
        font-size: 12px;
        color: #555;
        text-align: center;
        line-height: 1.5;
      }

      /* Settings panel */
      #settings-panel {
        display: none;
        flex-direction: column;
        padding: 12px;
        gap: 8px;
      }

      .settings-header {
        display: flex;
        align-items: center;
        gap: 6px;
        margin-bottom: 2px;
      }

      #btn-back {
        background: none;
        border: none;
        color: #555;
        cursor: pointer;
        font-size: 14px;
        padding: 0;
        line-height: 1;
        transition: color 0.15s;
      }

      #btn-back:hover {
        color: #999;
      }

      .settings-header span {
        font-size: 12px;
        font-weight: 600;
        color: #999;
        letter-spacing: 0.03em;
      }

      .settings-label {
        font-size: 11px;
        color: #555;
        line-height: 1.4;
      }

      .settings-input {
        width: 100%;
        background: #1a1a1a;
        border: 1px solid #2a2a2a;
        border-radius: 6px;
        color: #e8e8e8;
        font-family: inherit;
        font-size: 11px;
        line-height: 1.4;
        padding: 8px;
        outline: none;
        transition: border-color 0.15s;
      }

      .settings-input:focus {
        border-color: #444;
      }

      #prompt-prefix {
        width: 100%;
        min-height: 90px;
        background: #1a1a1a;
        border: 1px solid #2a2a2a;
        border-radius: 6px;
        color: #e8e8e8;
        font-family: inherit;
        font-size: 11px;
        line-height: 1.5;
        padding: 8px;
        resize: vertical;
        outline: none;
        transition: border-color 0.15s;
      }

      #prompt-prefix:focus {
        border-color: #444;
      }

      .mode-actions {
        display: flex;
        gap: 6px;
      }

      .mode-btn {
        flex: 1;
        background: #1a1a1a;
        border: 1px solid #2a2a2a;
        border-radius: 6px;
        color: #cfcfcf;
        font-size: 11px;
        padding: 8px;
        cursor: pointer;
        transition: background 0.15s, border-color 0.15s, color 0.15s;
      }

      .mode-btn:hover:not(:disabled) {
        background: #232323;
        border-color: #3a3a3a;
        color: #fff;
      }

      .mode-btn:disabled {
        cursor: default;
        opacity: 0.45;
      }

      .mode-hint {
        font-size: 10px;
        color: #666;
        line-height: 1.4;
      }

      .settings-row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 8px 0 2px;
      }

      .settings-row-label {
        font-size: 11px;
        color: #aaa;
        font-weight: 500;
      }

      .settings-row-hint {
        font-size: 10px;
        color: #555;
        margin-top: 1px;
      }

      /* Toggle switch */
      .toggle {
        position: relative;
        width: 32px;
        height: 18px;
        flex-shrink: 0;
      }

      .toggle input {
        opacity: 0;
        width: 0;
        height: 0;
        position: absolute;
      }

      .toggle-track {
        position: absolute;
        inset: 0;
        background: #2a2a2a;
        border: 1px solid #3a3a3a;
        border-radius: 99px;
        cursor: pointer;
        transition: background 0.2s, border-color 0.2s;
      }

      .toggle-track::after {
        content: '';
        position: absolute;
        top: 2px;
        left: 2px;
        width: 12px;
        height: 12px;
        background: #555;
        border-radius: 50%;
        transition: transform 0.2s, background 0.2s;
      }

      .toggle input:checked + .toggle-track {
        background: #1e3a2f;
        border-color: #2a5040;
      }

      .toggle input:checked + .toggle-track::after {
        transform: translateX(14px);
        background: #5dba8a;
      }

    </style>
  </head>
  <body>
    <div class="header">
      <div>
        <h1>AI vs AI</h1>
        <p>Get a second opinion</p>
      </div>
      <button id="btn-settings" title="Settings">⚙</button>
    </div>
    <div class="mode-bar" id="mode-bar">
      <label class="mode-picker" for="mode-select">
        <span class="mode-picker-label">Comparison mode</span>
        <select class="mode-select" id="mode-select"></select>
      </label>
    </div>
    <div class="scope-bar" id="scope-bar">
      <label class="scope-picker" for="scope-select">
        <span class="mode-picker-label">Send</span>
        <div class="scope-inline">
          <select class="mode-select" id="scope-select">
            <option value="full">Full conversation</option>
            <option value="last-n">Last N messages</option>
            <option value="latest-assistant">Latest assistant answer</option>
            <option value="latest-with-context">Latest answer + context</option>
          </select>
          <div class="last-n-wrap" id="last-n-wrap">
            <input class="last-n-input" id="last-n-input" type="number" min="2" max="50" />
            <span>msgs</span>
          </div>
        </div>
      </label>
    </div>

          <span class="arrow">→</span>
        </button>
      </div>
      <div class="status" id="status"></div>
    </div>

      <div class="settings-header">
        <button id="btn-back" title="Back">←</button>

      </div>
